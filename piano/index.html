<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Keyboard Piano</h1>
      <div class="piano">
        <button data-note="z" class="piano-key key1 key">z</button>
        <button data-note="x" class="piano-key key2 key">x</button>
        <button data-note="c" class="piano-key key3 key">c</button>
        <button data-note="q" class="piano-key key4 key">q</button>
        <button data-note="w" class="piano-key key5 key">w</button>
        <button data-note="e" class="piano-key key6 key">e</button>
        <button data-note="r" class="piano-key key7 key">r</button>
        <button data-note="t" class="piano-key key8 key">t</button>
        <button data-note="y" class="piano-key key9 key">y</button>
        <button data-note="u" class="piano-key key10 key">u</button>
        <button data-note="i" class="piano-key key11 key">i</button>
        <button data-note="o" class="piano-key key12 key">o</button>
        <button data-note="p" class="piano-key key13 key">p</button>
        <button data-note="[" class="piano-key key14 key">[</button>
        <button data-note="]" class="piano-key key15 key">]</button>
        <button data-note="v" class="piano-key key16 key">v</button>
        <button data-note="b" class="piano-key key17 key">b</button>
        <button data-note="n" class="piano-key key18 key">n</button>
        <button data-note="m" class="piano-key key19 key">m</button>
        <button data-note="," class="piano-key key20 key">,</button>
        <button data-note="." class="piano-key key21 key">.</button>

        <button data-note="s" class="piano-key black black-1">s</button>
        <button data-note="d" class="piano-key black black-2">d</button>
        <button data-note="2" class="piano-key black black-3">2</button>
        <button data-note="3" class="piano-key black black-4">3</button>
        <button data-note="4" class="piano-key black black-5">4</button>
        <button data-note="6" class="piano-key black black-6">6</button>
        <button data-note="7" class="piano-key black black-7">7</button>
        <button data-note="9" class="piano-key black black-8">9</button>
        <button data-note="0" class="piano-key black black-9">0</button>
        <button data-note="-" class="piano-key black black-10">-</button>
        <button data-note="f" class="piano-key black black-11">f</button>
        <button data-note="g" class="piano-key black black-12">g</button>
        <button data-note="j" class="piano-key black black-13">j</button>
        <button data-note="k" class="piano-key black black-14">k</button>
        <button data-note="l" class="piano-key black black-15">l</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
